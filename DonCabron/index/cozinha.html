<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌶️ Don Cabrón 🌶️ - Cozinha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/DonCabron/css/style.css" />
    <link rel="stylesheet" href="/DonCabron/css/modal.css" />
    <link rel="stylesheet" href="/DonCabron/css/cozinha.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img
          class="logo-clara"
          src="/DonCabron/img/logo.png"
          alt="Logo Don Cabrón"
        />
        <img
          class="logo-escura"
          src="/DonCabron/img/logo escura.png"
          alt="Logo Don Cabrón"
        />
      </div>
      <button class="menu-toggle" id="menu-toggle" type="button">☰</button>
      <nav class="menu" id="menu">
        <ul class="menu-list">
          <li class="menu-admin" hidden>
            <button id="btnInicio" class="menu-botao">INÍCIO</button>
          </li>
          <li class="menu-cadastro menu-admin" hidden>
            <button id="btnMenu" class="menu-botao">CADASTRO</button>
            <div class="dropdown-cadastro escondido">
              <a href="/DonCabron/index/fornecedor.html">Fornecedor</a
              ><a href="/DonCabron/index/usuarios.html">Usuários</a
              ><a href="/DonCabron/index/mesas.html">Mesas</a>
            </div>
          </li>
          <li class="menu-admin" hidden>
            <button id="btnRelatorios" class="menu-botao">RELATÓRIOS</button>
          </li>
          <li class="menu-admin" hidden>
            <button id="btnCozinha" class="menu-botao">COZINHA</button>
          </li>
          <li class="menu-sair">
            <a
              class="menu-botao menu-link"
              href="#"
              onclick="
                sairSistema();
                return false;
              "
              >SAIR</a
            >
          </li>
        </ul>
      </nav>
      <button class="tema" id="tema" type="button">
        <span class="icone-tema">🌙</span>
      </button>
    </header>

    <main class="cozinha-container">
      <div class="cabecalho-pedidos">
        <div>
          <h2>Pedidos</h2>
          <p id="usuarioCozinha">
            Os pedidos confirmados pelo garçom aparecem aqui automaticamente.
          </p>
        </div>

        <button id="btnAtualizar" class="btn-atualizar" type="button">
          ↻ Atualizar
        </button>
      </div>

      <div id="mensagemCozinha" class="mensagem"></div>

      <section class="painel-cozinha">
        <div class="coluna recebidos">
          <div class="titulo-coluna">
            <h3>Recebidos</h3>
            <span id="contadorRecebidos">0</span>
          </div>
          <div id="listaRecebidos" class="lista-pedidos"></div>
        </div>

        <div class="coluna preparo">
          <div class="titulo-coluna">
            <h3>Em preparo</h3>
            <span id="contadorPreparo">0</span>
          </div>
          <div id="listaPreparo" class="lista-pedidos"></div>
        </div>

        <div class="coluna prontos">
          <div class="titulo-coluna">
            <h3>Prontos</h3>
            <span id="contadorProntos">0</span>
          </div>
          <div id="listaProntos" class="lista-pedidos"></div>
        </div>
      </section>
    </main>

    <script src="/js/modal.js"></script>
    <script src="/js/permissoes.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/cozinha.js"></script>
  </body>
</html>
