<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Don Cabrón - Painel administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/DonCabron/css/style.css" />
    <link rel="stylesheet" href="/DonCabron/css/modal.css" />
    <link rel="stylesheet" href="/DonCabron/css/adminDashboard.css?v=2" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img class="logo-clara" src="/DonCabron/img/logo.png" alt="Logo" />
        <img
          class="logo-escura"
          src="/DonCabron/img/logo escura.png"
          alt="Logo"
        />
      </div>
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <nav class="menu" id="menu">
        <ul class="menu-list">
          <li>
            <button id="btnInicio" class="menu-botao">INÍCIO</button>
          </li>
          <li class="menu-cadastro">
            <button id="btnMenu" class="menu-botao">CADASTRO</button>
            <div class="dropdown-cadastro escondido">
              <a href="/DonCabron/index/fornecedor.html"> Fornecedor </a>

              <a href="/DonCabron/index/usuarios.html"> Usuários </a>

              <a href="/DonCabron/index/mesas.html"> Mesas </a>
            </div>
          </li>

          <li>
            <button id="btnRelatorios" class="menu-botao">RELATÓRIOS</button>
          </li>

          <li>
            <button id="btnCozinha" class="menu-botao">COZINHA</button>
          </li>
        </ul>
      </nav>

      <button class="tema" id="tema">
        <span class="icone-tema">🌙</span>
      </button>
    </header>

    <main class="painel-admin-main">
      <section class="painel-cabecalho">
        <div>
          <p class="painel-sobretitulo">OPERAÇÃO</p>
          <h1>Painel do restaurante</h1>
        </div>
        <div class="painel-filtros">
          <label for="dataPainel">Pedidos do dia</label>
          <input id="dataPainel" type="date" />
          <button id="atualizarPainel" type="button" aria-label="Atualizar painel">
            Atualizar
          </button>
        </div>
      </section>

      <p id="mensagemPainel" class="mensagem-painel" role="status" aria-live="polite"></p>

      <div class="painel-grade">
        <section class="painel-secao mesas-ocupadas">
          <header class="painel-secao-titulo">
            <div>
              <p class="painel-sobretitulo">SALÃO</p>
              <h2>Mesas ocupadas</h2>
            </div>
            <span id="totalMesas" class="painel-contador">0</span>
          </header>
          <div id="listaMesas" class="lista-mesas-painel"></div>
        </section>

        <section class="painel-secao pedidos-cozinha">
          <header class="painel-secao-titulo">
            <div>
              <p class="painel-sobretitulo">PRODUÇÃO</p>
              <h2>Pedidos na cozinha</h2>
            </div>
            <span id="totalPedidos" class="painel-contador">0</span>
          </header>
          <div id="listaPedidosCozinha" class="lista-pedidos-painel"></div>
        </section>

        <section class="painel-secao mais-vendidos">
          <header class="painel-secao-titulo">
            <div>
              <p class="painel-sobretitulo">DESEMPENHO DO DIA</p>
              <h2>3 itens mais vendidos</h2>
            </div>
          </header>
          <ol id="listaMaisVendidos" class="lista-mais-vendidos"></ol>
        </section>
      </div>
    </main>
    <script src="/js/modal.js"></script>
    <script src="/js/permissoes.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/adminDashboard.js?v=2"></script>
  </body>
</html>
