<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/DonCabron/css/loginStyle.css">
    <title>🌶️ Don Cabrón 🌶️- Login</title>

</head>
<body>
    <header>

    </header>
    <main>
        <article class="tela-de-login">
            <form class="login" id="form-login">
                <img src="/DonCabron/img/logo.png" alt="Logo" srcset="">

                <input id="email" class="usuario" type="email" placeholder="E-mail" required>

                <input id="senha" class="usuario" type="password" placeholder="Senha" required>

                <button class="logar" type="submit">Logar</button>
                <p id="mensagem-login"></p>
            </form>
        </article>
    </main>
    <script src="/js/script.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
