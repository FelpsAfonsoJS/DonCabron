<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌶️ Don Cabron 🌶️ - Mesas</title>
    <link rel="stylesheet" href="../css/mesas.css">

</head>
<body>
    <header class="header">
      <div class="logo">
        <img class="logo-clara" src="/DonCabron/img/logo.png" alt="Logo"/>
        <img class="logo-escura" src="/DonCabron/img/logo escura.png" srcset="">
      </div>
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <nav class="menu" id="menu">
        <ul>
          <li>
            <a href="/DonCabron/index/index.html" target="_blank" rel="">Inicio</a>
          </li>
          <li>
            <a href="#" target="_blank" rel="">Cardapio</a>
          </li>
          <li>
            <a href="#" target="_blank" rel="">Historico</a>
          </li>
          <li class="menu-cadastro">
            <span class="spanteste">
              <p>
                <button id="btnMenu" class="menu">MENU</button>
              </p>
              <span class="spanlista escondido">
                <p><a href="/DonCabron/index/fornecedor.html">Fornecedor</a></p>
              </span>
            </span>
        </ul>
      </nav>
      <button class="tema" id="tema">
        <span class="icone-tema">🌙</span>
      </button>
    </header>
<main>

  <div class="cadastro">

    <section class="cadastro-mesas">

      <h1>Cadastro de Mesas</h1>

      <form id="formMesa" novalidate>

        <div class="campo">
          <label for="numero">Número da Mesa</label>

          <input
            type="number"
            id="numero"
            name="numero"
            placeholder="Digite o número da mesa"
            min="1"
            required
          />
        </div>

        <div class="campo">
          <label for="capacidade">Capacidade</label>

          <input
            type="number"
            id="capacidade"
            name="capacidade"
            placeholder="Quantidade de lugares"
            min="1"
            required
          />
        </div>

        <button type="submit">Cadastrar Mesa</button>

      </form>

      <hr />

      <section class="lista-mesas">

        <h2>Mesas cadastradas</h2>

        <div
          id="resultadoMesas"
          class="resultado-mesas"
          aria-live="polite"
        >
        </div>

      </section>

    </section>

  </div>

</main>

<script src="/js/mesas.js"></script>

    
</body>
</html>
