<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌶️ Don Cabron 🌶️ - Mesas</title>
    <link rel="stylesheet" href="/DonCabron/css/modal.css" />
    <link rel="stylesheet" href="../css/mesas.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img class="logo-clara" src="/DonCabron/img/logo.png" alt="Logo" />
        <img
          class="logo-escura"
          src="/DonCabron/img/logo escura.png"
          srcset=""
        />
      </div>
      <button class="menu-toggle" id="menu-toggle">☰</button>
      <nav class="menu" id="menu">
        <ul class="menu-list">
          <li class="menu-admin" hidden>
            <button id="btnInicio" class="menu-botao">INÍCIO</button>
          </li>
          <li class="menu-cadastro menu-admin" hidden>
            <button id="btnMenu" class="menu-botao">CADASTRO</button>

            <div class="dropdown-cadastro escondido">
              <a href="/DonCabron/index/fornecedor.html"> Fornecedor </a>
              <a href="/DonCabron/index/usuarios.html"> Usuários </a>
              <a href="/DonCabron/index/mesas.html"> Mesas </a>
            </div>
          </li>

          <li class="menu-admin" hidden>
            <button id="btnRelatorios" class="menu-botao">RELATÓRIOS</button>
          </li>





          <li class="menu-admin" hidden>
            <a
              class="menu-botao menu-link"
              href="/DonCabron/index/cozinha.html"
            >
              COZINHA
            </a>
          </li>
          <li class="menu-sair">
            <a
              class="menu-botao menu-link"
              href="#"
              onclick="
                sairSistema();
                return false;
              "
              >SAIR</a
            >
          </li>
        </ul>
      </nav>
      <button class="tema" id="tema">
        <span class="icone-tema">🌙</span>
      </button>
    </header>
    <main>
      <div class="cadastro">
        <section class="cadastro-mesas">
          <h1>Cadastro de Mesas</h1>

          <form id="formMesa" novalidate>
            <div class="campo">
              <label for="numero">Número da Mesa</label>

              <input
                type="number"
                id="numero"
                name="numero"
                placeholder="Digite o número da mesa"
                min="1"
                max="2147483647"
                step="1"
                required
              />
            </div>

            <div class="campo">
              <label for="capacidade">Capacidade</label>

              <input
                type="number"
                id="capacidade"
                name="capacidade"
                placeholder="Quantidade de lugares"
                min="1"
                max="2147483647"
                step="1"
                required
              />
            </div>

            <button type="submit">Cadastrar Mesa</button>
          </form>

          <hr />

          <section class="lista-mesas">
            <h2>Mesas cadastradas</h2>

            <div
              id="resultadoMesas"
              class="resultado-mesas"
              aria-live="polite"
            ></div>
          </section>
        </section>
      </div>
    </main>

    <script src="/js/modal.js"></script>
    <script src="/js/permissoes.js"></script>
    <script src="/js/mesas.js"></script>
  </body>
</html>
